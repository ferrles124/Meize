name: Unpack XNB

on:
  workflow_dispatch:
  push:

jobs:
  unpack:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clone xnbcli
        run: git clone https://github.com/LeonBlade/xnbcli.git xnbcli-tool

      - name: Install xnbcli dependencies
        run: |
          cd xnbcli-tool
          npm install

      - name: Prepare packed folder
        run: |
          mkdir -p xnbcli-tool/packed
          find . -maxdepth 3 -iname "*.xnb" -exec cp {} xnbcli-tool/packed/ \;

      - name: Unpack XNB files
        run: |
          cd xnbcli-tool
          node xnbcli unpack packed unpacked

      - name: Clone ToasterMapCLI
        run: git clone https://github.com/ToasterSDV/ToasterMapCLI.git toaster-tool

      - name: Fetch game DLLs from GiftMail repo
        run: |
          git clone --depth 1 https://github.com/ferrles124/GiftMail.git giftmail-libs
          find giftmail-libs -iname "*.dll"
          find giftmail-libs -iname "xTile.dll" -exec cp {} toaster-tool/ \;
          find giftmail-libs -iname "MonoGame.Framework.dll" -exec cp {} toaster-tool/ \;

      - name: Add DLL references to csproj
        run: |
          cd toaster-tool
          sed -i 's|</Project>|  <ItemGroup>\n    <Reference Include="xTile"><HintPath>xTile.dll</HintPath></Reference>\n    <Reference Include="MonoGame.Framework"><HintPath>MonoGame.Framework.dll</HintPath></Reference>\n  </ItemGroup>\n</Project>|' ToasterMapCLI.csproj
          cat ToasterMapCLI.csproj

      - name: Build ToasterMapCLI
        run: |
          cd toaster-tool
          dotnet build ToasterMapCLI.csproj -c Release -r linux-x64 --self-contained false
      - name: Inspect ToasterMapCLI usage
        run: |
          find toaster-tool -iname "ToasterMapCLI.dll" -path "*linux-x64*"
          DLLPATH=$(find toaster-tool -iname "ToasterMapCLI.dll" -path "*linux-x64*" | head -n 1)
          echo "Using: $DLLPATH"
          dotnet "$DLLPATH" || true

      - name: Upload unpacked result
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-maps
          path: xnbcli-tool/unpacked/
